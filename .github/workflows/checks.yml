name: Demo validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m demo.generate_samples
      - run: python -m demo.validate demo/samples/A0426.txt demo/samples/L0426.txt demo/samples/I0426.txt
